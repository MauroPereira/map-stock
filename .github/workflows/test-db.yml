name: Ejecutar test-db en rama test

on:
  push:
    branches:
      - test

jobs:
  run-test-db:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repo 😘
        uses: actions/checkout@v3

      - name: Instalar Python 3.9 🐍
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Instalar dependencias pip 😼
        run: |
          python -m pip install --upgrade pip
          pip install -r map-stock/requirements.txt

      - name: Ejecutar test eliminando base de datos 🔥
        run: |
          rm -f map-stock/database/bd.db
          python3 map-stock/testing/test-00.py
