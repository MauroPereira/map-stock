name: Run test-db on deploy branch

on:
  workflow_dispatch:
    inputs:
      registry_password:
        description: "Docker Registry Password"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Check if branch is deploy
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/deploy" ]]; then
            echo "This workflow can only run on the deploy branch!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        run: |
          echo "${{ github.event.inputs.registry_password }}" | docker login http://www.map-systems.online -u admin --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t www.map-systems.online/map-stock:latest -f deploy/Dockerfile .
          docker push www.map-systems.online/map-stock:latest
