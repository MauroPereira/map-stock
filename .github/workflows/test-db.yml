name: "Run test-db on deploy branch "

on:
  workflow_dispatch:
    inputs:
      registry_password:
        description: "Docker Registry Password"
        required: true
        type: string

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        env:
          REGISTRY_PASSWORD: ${{ github.event.inputs.registry_password }}
        run: |
          # Option to disable logging of commands, where the password is being watched, is using 'set +x' 
          # before and after the critical command.

          set +x  # Deshabilita el logging de comandos
          echo "$REGISTRY_PASSWORD" | docker login http://www.map-systems.online -u admin --password-stdin
          set +x  # Deshabilita el logging de comandos

      - name: Build and push Docker image
        run: |
          docker build -t www.map-systems.online/map-stock:latest -f map-stock/deploy/Dockerfile map-stock
          docker push www.map-systems.online/map-stock:latest
